name: sweetscdump (read-only network config dump)

on:
  push:
    branches: [chlorophyll]
    paths: ['.github/workflows/sweetscdump.yml', 'tools/sweetnet/sweetscdump.c', 'tools/sweetnet/sweetnetcfg.c']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build (as tools/sweetnet/build.sh builds sweetnetcfg)
        run: |
          mkdir -p out
          for t in sweetscdump sweetnetcfg; do
            xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -O2 -Wall -Werror \
              -framework CoreFoundation tools/sweetnet/$t.c -o out/$t
            codesign -s - -f --entitlements tools/sweetnet/entitlements.plist out/$t
          done
          file out/*
          (cd out && shasum -a 256 sweetscdump sweetnetcfg | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sweetscdump
          path: out/
